# Fly.io config for the VAVA Telegram bot (long-polling worker, no HTTP).
# Docs: https://fly.io/docs/reference/configuration/

app = 'vila-akoya-telegram-bot'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  RECAP_TZ = 'Europe/Lisbon'
  PORT = '8080'

# Keep the machine running 24/7 (Fly stops idle machines without an http_service).
[http_service]
  processes = ['app']
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[processes]
  app = 'node scripts/vila-akoya-telegram-bot.js'

# Exactly one machine — two pollers on the same token cause Telegram 409 conflicts.
[deploy]
  strategy = 'immediate'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'bot_data'
  destination = '/data'
